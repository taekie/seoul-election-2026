<script async src="https://www.googletagmanager.com/gtag/js?id=G-9P480FT8BY"></script>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  body { font-family:'KoddiUD OnGothic',Georgia,-apple-system,sans-serif;
    background:#FFF1E5; color:#333; padding:40px 48px; margin:0; -webkit-font-smoothing:antialiased; }
  h1 { font-size:25px; font-weight:700; color:#1a1a1a; margin:0 0 6px; letter-spacing:-0.3px; }
  .sub { font-size:14px; color:#66605C; margin:0 0 3px; max-width:820px; line-height:1.5; }
  .source { font-size:11.5px; color:#998f86; margin:8px 0 16px; }
  .rule { border:0; border-top:1.5px solid #423933cc; margin:0 0 6px; max-width:820px; }
  .sect { font-size:16px; font-weight:700; color:#1a1a1a; margin:16px 0 2px; }
  .sect small { font-weight:400; color:#998f86; font-size:12px; margin-left:6px; }
  .num { display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px;
    border-radius:5px; color:#fff; font-size:13px; font-weight:700; margin-right:7px; vertical-align:middle; background:#423933; }
  .row { display:flex; gap:24px; flex-wrap:nowrap; align-items:flex-start; }
  .row > div { flex:0 0 auto; }
  svg { display:block; }

<body>
<h1>투표 인구 피라미드</h1>
<div class="sub">맨 위 <b>투표자 피라미드</b>는 높이=유권자수·너비=투표율(=투표율 격차를 보여줌, 면적=투표자수). 아래 둘은 <b>높이를 동일하게</b> 맞추고 너비=각 후보 득표수.</div>
<div class="source">자료: 유권자수 행안부 주민등록(서울, 2026.05, 18+) · 투표율 제8회 지선(2022) 패턴 추정 · 성별·연령 지지율 SBS 출구조사 사전반영 재계산 · <b>총득표 실제 개표(서울시장 2026)에 보정</b></div>
<hr class="rule">
<div id="charts"></div>
<div class="note" id="note"></div>

<script>
const D = [
  {age:'20대',  m_e:656678,f_e:739229, m_t:33.3,f_t:39.5, m_pre:16.2,f_pre:16.1, m_jo:23.7,f_jo:56.7, m_oh:69.8,f_oh:31.7},
  {age:'30대',  m_e:733823,f_e:735508, m_t:33.5,f_t:37.0, m_pre:15.2,f_pre:16.1, m_jo:35.9,f_jo:51.3, m_oh:57.8,f_oh:45.3},
  {age:'40대',  m_e:670066,f_e:685789, m_t:44.0,f_t:45.5, m_pre:18.1,f_pre:17.1, m_jo:63.4,f_jo:62.3, m_oh:36.2,f_oh:35.2},
  {age:'50대',  m_e:718664,f_e:744091, m_t:56.0,f_t:56.5, m_pre:24.6,f_pre:21.5, m_jo:66.5,f_jo:66.8, m_oh:32.2,f_oh:32.3},
  {age:'60대',  m_e:625782,f_e:692235, m_t:71.0,f_t:68.0, m_pre:34.7,f_pre:28.3, m_jo:57.7,f_jo:48.8, m_oh:42.2,f_oh:50.0},
  {age:'70대+', m_e:551495,f_e:730015, m_t:75.0,f_t:64.0, m_pre:33.6,f_pre:21.9, m_jo:37.3,f_jo:35.0, m_oh:62.1,f_oh:64.0},
].reverse();    // 70대+ 위 → 20대 아래
const DELTA=0.279, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));   // 성향강도(통합 시뮬과 동일)
let totV=0,totJ=0,totO=0,sumE=0;
D.forEach(d=>{
  d.m_v=d.m_e*d.m_t/100; d.f_v=d.f_e*d.f_t/100;
  d.m_jv=d.m_v*d.m_jo/100; d.f_jv=d.f_v*d.f_jo/100;
  d.m_ov=d.m_v*d.m_oh/100; d.f_ov=d.f_v*d.f_oh/100;
  // 성향효과: 사전 투표자는 더 진보, 당일은 더 보수 (셀 일관성 유지) → 득표를 사전/당일로 분할
  ['m','f'].forEach(s=>{
    const tot=d[s+'_t'], pre=d[s+'_pre'], day=tot-pre, w=pre/tot;
    const pv=d[s+'_e']*pre/100, dv=d[s+'_e']*day/100, pool=(d[s+'_jo']+d[s+'_oh'])/100;
    const p=d[s+'_jo']/(d[s+'_jo']+d[s+'_oh']);
    const jPre=clamp(p+(1-w)*DELTA,0,1), jDay=clamp(p-w*DELTA,0,1);
    d[s+'_jvP']=pv*pool*jPre;     d[s+'_jvD']=dv*pool*jDay;       // 정원오 사전/당일
    d[s+'_ovP']=pv*pool*(1-jPre); d[s+'_ovD']=dv*pool*(1-jDay);   // 오세훈 사전/당일
  });
  totV+=d.m_v+d.f_v; totJ+=d.m_jv+d.f_jv; totO+=d.m_ov+d.f_ov;
  sumE+=Math.max(d.m_e,d.f_e);
});
// 실제 개표 결과(서울시장 2026)로 전체 득표 레벨 보정 — 연령성별 분포(비중%)는 유지
const JO_REAL=2515560, OH_REAL=2575819, VALID=5232982;
const calibJ=JO_REAL/totJ, calibO=OH_REAL/totO;
const joPct=JO_REAL/VALID*100, ohPct=OH_REAL/VALID*100;
D.forEach(d=>{ d.m_jv*=calibJ; d.f_jv*=calibJ; d.m_ov*=calibO; d.f_ov*=calibO;
  d.m_jvP*=calibJ; d.m_jvD*=calibJ; d.f_jvP*=calibJ; d.f_jvD*=calibJ;
  d.m_ovP*=calibO; d.m_ovD*=calibO; d.f_ovP*=calibO; d.f_ovD*=calibO; });
totJ=JO_REAL; totO=OH_REAL;
// 배경 톤으로 옅게
const COLm='#4E9DA0', COLf='#E0A567', JO='#6385B4', OH='#CE7068', GHOST='#EEE2D4';
const JO_PRE=JO, JO_DAY='#acc3e0', OH_PRE=OH, OH_DAY='#e7b3ab';  // 사전=출구조사색·당일=연한 버전
const COLm_DAY='#a6cdcf', COLf_DAY='#eccba6';  // 투표자 당일(연한) · 사전=COLm/COLf
const maxV=d3.max(D,d=>Math.max(d.m_v,d.f_v));
const fmt=v=>Math.round(v/10000)+'만';
const plotH=300, GAP=8, bandH=(plotH-GAP*(D.length-1))/D.length;

function pyramid(host, mode, Wp){
  const big=Wp>600, isT=(mode==='turnout');
  const mt=30,mb=26,ml=big?78:60,mr=big?40:32;
  const plotW=Wp-ml-mr, gut=4, halfW=plotW/2-gut, cx=ml+plotW/2, H=plotH+mt+mb;
  const fT=big?11:10, fI=big?11:9.5, fA=big?12.5:11;
  const x=d3.scaleLinear().domain([0, isT?80:maxV]).range([0,halfW]);
  // y 레이아웃: ① 높이=유권자(변동), ②③ 동일 밴드
  const sT=(plotH-GAP*(D.length-1))/sumE;
  let layout;
  if(isT){ let yb=0; layout=D.map(d=>{const h=Math.max(d.m_e,d.f_e)*sT; const cy=yb+h/2; yb+=h+GAP; return {cy,h};}); }
  else { layout=D.map((d,i)=>({cy:i*(bandH+GAP)+bandH/2, h:bandH})); }

  const svg=d3.select(host).append('svg').attr('width',Wp).attr('height',H).attr('viewBox',`0 0 ${Wp} ${H}`);
  const g=svg.append('g').attr('transform',`translate(0,${mt})`);
  const ticks=isT?[25,50,75]:[200000,400000];
  ticks.forEach(v=>[-1,1].forEach(sg=>g.append('line').attr('x1',cx+sg*x(v)).attr('x2',cx+sg*x(v))
    .attr('y1',-4).attr('y2',plotH).attr('stroke','#E6D9CE').attr('stroke-width',1)));

  D.forEach((d,i)=>{
    const {cy,h}=layout[i];
    const hm=isT?d.m_e*sT:h, hf=isT?d.f_e*sT:h;
    let lenM,lenF,fullM,fullF,colM,colF,tipM,tipF,inM,inF;
    if(isT){ lenM=fullM=x(d.m_t); lenF=fullF=x(d.f_t); colM=COLm; colF=COLf;
      tipM=d.m_t.toFixed(0)+'%'; tipF=d.f_t.toFixed(0)+'%'; inM=(d.m_v/totV*100).toFixed(1)+'%'; inF=(d.f_v/totV*100).toFixed(1)+'%';
    } else if(mode==='jo'){ fullM=x(d.m_v); fullF=x(d.f_v); lenM=x(d.m_jv); lenF=x(d.f_jv); colM=colF=JO;
      tipM=d.m_jo.toFixed(0)+'%'; tipF=d.f_jo.toFixed(0)+'%'; inM=(d.m_jv/totJ*100).toFixed(1)+'%'; inF=(d.f_jv/totJ*100).toFixed(1)+'%';
    } else { fullM=x(d.m_v); fullF=x(d.f_v); lenM=x(d.m_ov); lenF=x(d.f_ov); colM=colF=OH;
      tipM=d.m_oh.toFixed(0)+'%'; tipF=d.f_oh.toFixed(0)+'%'; inM=(d.m_ov/totO*100).toFixed(1)+'%'; inF=(d.f_ov/totO*100).toFixed(1)+'%';
    }
    if(!isT){
      g.append('rect').attr('x',cx-fullM).attr('y',cy-h/2).attr('width',fullM).attr('height',h).attr('fill',GHOST);
      g.append('rect').attr('x',cx).attr('y',cy-h/2).attr('width',fullF).attr('height',h).attr('fill',GHOST);
    }
    if(isT){  // 투표자를 사전(진)+당일(연)으로 분할
      const pm=x(d.m_pre), dm=x(d.m_t-d.m_pre), pf=x(d.f_pre), df=x(d.f_t-d.f_pre);
      g.append('rect').attr('x',cx-pm).attr('y',cy-hm/2).attr('width',pm).attr('height',hm).attr('fill',COLm);
      g.append('rect').attr('x',cx-pm-dm).attr('y',cy-hm/2).attr('width',dm).attr('height',hm).attr('fill',COLm_DAY);
      g.append('rect').attr('x',cx).attr('y',cy-hf/2).attr('width',pf).attr('height',hf).attr('fill',COLf);
      g.append('rect').attr('x',cx+pf).attr('y',cy-hf/2).attr('width',df).attr('height',hf).attr('fill',COLf_DAY);
    } else {  // 득표를 사전(진)+당일(연)으로 분할
      const k=mode==='jo'?'jv':'ov', cP=mode==='jo'?JO_PRE:OH_PRE, cD=mode==='jo'?JO_DAY:OH_DAY;
      const pm=x(d['m_'+k+'P']), dm=x(d['m_'+k+'D']), pf=x(d['f_'+k+'P']), df=x(d['f_'+k+'D']);
      g.append('rect').attr('x',cx-pm).attr('y',cy-hm/2).attr('width',pm).attr('height',hm).attr('fill',cP);
      g.append('rect').attr('x',cx-pm-dm).attr('y',cy-hm/2).attr('width',dm).attr('height',hm).attr('fill',cD);
      g.append('rect').attr('x',cx).attr('y',cy-hf/2).attr('width',pf).attr('height',hf).attr('fill',cP);
      g.append('rect').attr('x',cx+pf).attr('y',cy-hf/2).attr('width',df).attr('height',hf).attr('fill',cD);
    }
    // 외부 숫자(투표율/지지율)
    g.append('text').attr('x',cx-fullM-5).attr('y',cy+4).attr('text-anchor','end').attr('font-size',fT).attr('font-weight',700).attr('fill','#6b6258').text(tipM);
    g.append('text').attr('x',cx+fullF+5).attr('y',cy+4).attr('text-anchor','start').attr('font-size',fT).attr('font-weight',700).attr('fill','#6b6258').text(tipF);
    // 내부 비중%
    if(lenM>32) g.append('text').attr('x',cx-lenM*0.5).attr('y',cy+4).attr('text-anchor','middle').attr('font-size',fI).attr('font-weight',700).attr('fill','#fff').text(inM);
    if(lenF>32) g.append('text').attr('x',cx+lenF*0.5).attr('y',cy+4).attr('text-anchor','middle').attr('font-size',fI).attr('font-weight',700).attr('fill','#fff').text(inF);
    // 연령 (왼쪽 축)
    g.append('text').attr('x',0).attr('y',cy+4).attr('text-anchor','start').attr('font-size',fA).attr('font-weight',700).attr('fill','#1a1a1a').text(d.age);
  });
  g.append('text').attr('x',cx-halfW).attr('y',-14).attr('text-anchor','start').attr('font-size',12).attr('font-weight',700).attr('fill','#999').text('남성');
  g.append('text').attr('x',cx+halfW).attr('y',-14).attr('text-anchor','end').attr('font-size',12).attr('font-weight',700).attr('fill','#999').text('여성');
  // 바 위 사전/당일 라벨(색으로 구분)
  const preC=isT?COLm:(mode==='jo'?JO_PRE:OH_PRE), dayC=isT?COLm_DAY:(mode==='jo'?JO_DAY:OH_DAY);
  g.append('text').attr('x',cx-6).attr('y',-14).attr('text-anchor','end').attr('font-size',12).attr('font-weight',700).attr('fill',preC).text('사전');
  g.append('text').attr('x',cx+6).attr('y',-14).attr('text-anchor','start').attr('font-size',12).attr('font-weight',700).attr('fill',dayC).text('당일');
  ticks.forEach(v=>[-1,1].forEach(sg=>g.append('text').attr('x',cx+sg*x(v)).attr('y',plotH+15).attr('text-anchor','middle').attr('font-size',9).attr('fill','#b3a99e').text(isT?v+'%':fmt(v))));
}

// 출구조사 성별·연령 지지율 표(방송 그래픽: 정원오|오세훈 누적 가로막대)
function rateTable(host, Wp){
  const mt=30,mb=26,ml=54,mr=18;
  const plotW=Wp-ml-mr, x0=ml, H=plotH+mt+mb;
  const x=d3.scaleLinear().domain([0,100]).range([0,plotW]);
  const svg=d3.select(host).append('svg').attr('width',Wp).attr('height',H).attr('viewBox',`0 0 ${Wp} ${H}`);
  const g=svg.append('g').attr('transform',`translate(0,${mt})`);
  D.forEach((d,i)=>{
    const cy=i*(bandH+GAP)+bandH/2;
    g.append('text').attr('x',0).attr('y',cy+4).attr('font-size',12.5).attr('font-weight',700).attr('fill','#1a1a1a').text(d.age);
    ['m','f'].forEach((s,si)=>{
      const bh=bandH/2-3, sy=cy+(si===0?-1:1)*(bandH/4);
      const jo=d[s+'_jo'], oh=d[s+'_oh'], etc=Math.max(0,100-jo-oh);
      g.append('rect').attr('x',x0).attr('y',sy-bh/2).attr('width',x(jo)).attr('height',bh).attr('fill',JO);
      g.append('rect').attr('x',x0+x(jo)).attr('y',sy-bh/2).attr('width',x(etc)).attr('height',bh).attr('fill','#c8bdb0');
      g.append('rect').attr('x',x0+x(jo)+x(etc)).attr('y',sy-bh/2).attr('width',x(oh)).attr('height',bh).attr('fill',OH);
      g.append('text').attr('x',x0-5).attr('y',sy+3.5).attr('text-anchor','end').attr('font-size',10).attr('font-weight',700).attr('fill','#998f86').text(si===0?'남':'여');
      if(x(jo)>20) g.append('text').attr('x',x0+5).attr('y',sy+3.5).attr('font-size',10).attr('font-weight',700).attr('fill','#fff').text(jo.toFixed(0));
      if(x(etc)>16) g.append('text').attr('x',x0+x(jo)+x(etc)/2).attr('y',sy+3.5).attr('text-anchor','middle').attr('font-size',9).attr('font-weight',700).attr('fill','#fff').text(etc.toFixed(0));
      if(x(oh)>20) g.append('text').attr('x',x0+x(jo)+x(etc)+x(oh)-5).attr('y',sy+3.5).attr('text-anchor','end').attr('font-size',10).attr('font-weight',700).attr('fill','#fff').text(oh.toFixed(0));
    });
  });
}

const charts=document.getElementById('charts');
const header=(host,t,sub)=>{const d=document.createElement('div');d.className='sect';d.innerHTML=t+(sub?` <small>${sub}</small>`:'');host.appendChild(d);};

// 1행: 출구조사 지지율(왼) + 투표자 피라미드(오른)
const row1=document.createElement('div'); row1.className='row'; charts.appendChild(row1);
const col1=document.createElement('div'); row1.appendChild(col1);
header(col1, `<span class="num">·</span>출구조사 지지율`, '<b style="color:#6385B4">정원오</b> · <b style="color:#CE7068">오세훈</b> · <b style="color:#a89a8a">기타</b> · SBS 사전반영 재계산');
rateTable(col1, 360);
const colT=document.createElement('div'); row1.appendChild(colT);
header(colT, `<span class="num">1</span>투표자`, '높이=유권자수 · 너비=투표율 · 면적=투표자수');
pyramid(colT,'turnout',460);

// 2행: 정원오(왼) + 오세훈(오른)
const row2=document.createElement('div'); row2.className='row'; charts.appendChild(row2);
const col2=document.createElement('div'); row2.appendChild(col2);
header(col2, `<span class="num">2</span>정원오 · 실제 ${joPct.toFixed(1)}% (${(JO_REAL/10000).toFixed(0)}만표)`, '회색=투표자 · %=정원오 표 중 비중');
pyramid(col2,'jo',398);
const col3=document.createElement('div'); row2.appendChild(col3);
header(col3, `<span class="num">3</span>오세훈 · 실제 ${ohPct.toFixed(1)}% (${(OH_REAL/10000).toFixed(0)}만표)`, '회색=투표자 · %=오세훈 표 중 비중');
pyramid(col3,'oh',398);

document.getElementById('note').innerHTML =
  `<b>①</b> 투표자 피라미드는 너비가 투표율이라, <b>20대(33~40%)와 70대(64~75%)의 투표율 격차</b>가 막대 길이로 크게 벌어진다(면적=투표자수). ` +
  `<b>②③</b>은 높이를 맞추고 너비를 득표수로 둬 후보별로 비교하기 쉽다 — <b>정원오는 40·50대</b>, <b>오세훈은 20대 남성·60·70대</b>가 깊게 채워진다. ` +
  `<b>실제 개표 결과 오세훈 ${ohPct.toFixed(1)}% : 정원오 ${joPct.toFixed(1)}%</b>로 약 ${((OH_REAL-JO_REAL)/10000).toFixed(1)}만표(${((OH_REAL-JO_REAL)/VALID*100).toFixed(1)}%p) 차 신승. ` +
  `성별·연령 지지율은 <b>SBS 출구조사 사전반영 재계산</b>이고, 전체 득표 레벨은 실제 개표에 맞춰 보정했다. ` +
  `<b>추정이 남는 부분</b>은 성별·연령별 실제 투표율과 사전/당일 분할, 그리고 같은 성별·연령 안에서 사전투표자가 얼마나 더 진보적인지에 대한 분할이다.`;
</script>
</body>
</html>
