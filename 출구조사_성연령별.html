<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서울시장 출구조사 성·연령별 지지율</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9P480FT8BY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9P480FT8BY');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      body {
        font-family:
          "KoddiUD OnGothic",
          Georgia,
          -apple-system,
          sans-serif;
        background: #fff1e5;
        color: #333;
        padding: 40px 48px;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 25px;
        font-weight: 700;
        color: #1a1a1a;
        margin: 0 0 6px;
      }
      .sub {
        font-size: 14px;
        color: #66605c;
        margin: 0 0 3px;
        max-width: 760px;
        line-height: 1.5;
      }
      .source {
        font-size: 11.5px;
        color: #998f86;
        margin: 8px 0 14px;
      }
      .rule {
        border: 0;
        border-top: 1.5px solid #423933cc;
        margin: 0 0 14px;
        max-width: 760px;
      }
      svg {
        display: block;
        max-width: 760px;
      }
      .note {
        margin: 14px 0 0;
        padding: 14px 16px;
        background: #f7e7d9;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.6;
        color: #4a423c;
        max-width: 728px;
      }
      .note b {
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <h1>서울시장 출구조사</h1>
    <div class="sub">성별·연령대별 후보 지지율 사전반영(재계산).</div>
    <div class="source">자료: SBS_연령성별_득표율.pdf</div>
    <hr class="rule" />
    <div id="chart"></div>
    <div class="note">
      <b>기타</b>는 김정철·유지혜·권영국 득표율의 합이다. 소수점 반올림 때문에
      행 합계가 100%와 약간 다를 수 있다.
    </div>

    <script>
      const DATA = [
        {
          age: "20대 이하",
          m: { jo: 23.7, oh: 69.8, etc: 6.5 },
          f: { jo: 56.7, oh: 31.7, etc: 11.7 },
        },
        {
          age: "30대",
          m: { jo: 35.9, oh: 57.8, etc: 6.2 },
          f: { jo: 51.3, oh: 45.3, etc: 3.4 },
        },
        {
          age: "40대",
          m: { jo: 63.4, oh: 36.2, etc: 0.4 },
          f: { jo: 62.3, oh: 35.2, etc: 2.5 },
        },
        {
          age: "50대",
          m: { jo: 66.5, oh: 32.2, etc: 1.3 },
          f: { jo: 66.8, oh: 32.3, etc: 0.8 },
        },
        {
          age: "60대",
          m: { jo: 57.7, oh: 42.2, etc: 0.1 },
          f: { jo: 48.8, oh: 50.0, etc: 1.2 },
        },
        {
          age: "70대 이상",
          m: { jo: 37.3, oh: 62.1, etc: 0.6 },
          f: { jo: 35.0, oh: 64.0, etc: 0.9 },
        },
      ];

      const W = 760;
      const rowH = 58;
      const mt = 42;
      const mr = 28;
      const mb = 34;
      const ml = 104;
      const H = mt + mb + DATA.length * rowH;
      const plotW = W - ml - mr;
      const x = d3.scaleLinear().domain([0, 100]).range([0, plotW]);
      const JO = "#6385B4";
      const OH = "#CE7068";
      const ETC = "#b9ab9c";

      const svg = d3
        .select("#chart")
        .append("svg")
        .attr("width", W)
        .attr("height", H)
        .attr("viewBox", `0 0 ${W} ${H}`);
      const g = svg.append("g").attr("transform", `translate(${ml},${mt})`);

      const legend = svg.append("g").attr("transform", `translate(${ml},16)`);
      [
        ["정원오", JO, 0],
        ["오세훈", OH, 84],
        ["기타 = 김정철·유지혜·권영국", ETC, 168],
      ].forEach(([label, color, lx]) => {
        legend
          .append("rect")
          .attr("x", lx)
          .attr("y", 0)
          .attr("width", 14)
          .attr("height", 9)
          .attr("rx", 2)
          .attr("fill", color);
        legend
          .append("text")
          .attr("x", lx + 19)
          .attr("y", 9)
          .attr("font-size", 12)
          .attr("font-weight", 700)
          .attr("fill", "#5f574f")
          .text(label);
      });

      [25, 50, 75].forEach((v) => {
        g.append("line")
          .attr("x1", x(v))
          .attr("x2", x(v))
          .attr("y1", -8)
          .attr("y2", DATA.length * rowH - 10)
          .attr("stroke", "#E6D9CE")
          .attr("stroke-width", 1);
        g.append("text")
          .attr("x", x(v))
          .attr("y", DATA.length * rowH + 12)
          .attr("text-anchor", "middle")
          .attr("font-size", 10)
          .attr("fill", "#b3a99e")
          .text(v + "%");
      });

      function drawSegment(row, y, sexLabel) {
        const h = 22;
        const vals = [
          ["jo", row.jo, JO],
          ["etc", row.etc, ETC],
          ["oh", row.oh, OH],
        ];
        let cur = 0;
        vals.forEach(([key, value, color]) => {
          const w = x(value);
          g.append("rect")
            .attr("x", x(cur))
            .attr("y", y - h / 2)
            .attr("width", w)
            .attr("height", h)
            .attr("fill", color);
          if (w > 28) {
            g.append("text")
              .attr("x", x(cur) + (key === "oh" ? w - 5 : 5))
              .attr("y", y + 3.5)
              .attr("text-anchor", key === "oh" ? "end" : "start")
              .attr("font-size", 10)
              .attr("font-weight", 800)
              .attr("fill", "#fff")
              .text(value.toFixed(1));
          }
          cur += value;
        });
        g.append("text")
          .attr("x", -9)
          .attr("y", y + 4)
          .attr("text-anchor", "end")
          .attr("font-size", 11)
          .attr("font-weight", 800)
          .attr("fill", "#8a8178")
          .text(sexLabel);
      }

      DATA.forEach((d, i) => {
        const y = i * rowH + 24;
        g.append("text")
          .attr("x", -34)
          .attr("y", y + 4)
          .attr("text-anchor", "end")
          .attr("font-size", 13)
          .attr("font-weight", 800)
          .attr("fill", "#1a1a1a")
          .text(d.age);
        drawSegment(d.m, y - 11, "남");
        drawSegment(d.f, y + 13, "여");
      });
    </script>
  </body>
</html>
